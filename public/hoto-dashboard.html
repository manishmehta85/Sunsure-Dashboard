<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HOTO Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF5EE; --side:#FFFFFF; --card:#FFFFFF; --line:#ECE4DA; --line2:#F4EFE7;
  --or:#E8590C; --or-d:#C64A08; --or-soft:#FBEADD;
  --blue:#2F6FE0; --blue-s:#E7EFFC; --green:#1FA36B; --green-s:#E4F4EC;
  --red:#E0453A; --red-s:#FBE7E5; --amber:#E39A2B; --amber-s:#FBF0D9; --grey:#C4BCB1; --grey-s:#F0ECE4;
  --ink:#1C1917; --muted:#7A7268; --muted-l:#AAA298;
  --sh:0 1px 2px rgba(60,40,20,.04),0 10px 24px rgba(60,40,20,.05); --sh-s:0 1px 3px rgba(60,40,20,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.done{--c:var(--green);--cs:var(--green-s)}.prog{--c:var(--blue);--cs:var(--blue-s)}.pend{--c:var(--amber);--cs:var(--amber-s)}.nreq{--c:var(--grey);--cs:var(--grey-s)}

.app{display:grid;grid-template-columns:252px 1fr;height:100vh}
/* SIDEBAR */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 4px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--or),#F0791F);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(232,89,12,.3)}
.logo svg{width:24px;height:24px;color:#fff}
.brand .nm{font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1}
.brand .tg{font-size:11px;color:var(--muted);margin-top:3px}
.slab{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-l);font-weight:700;padding:0 8px;margin:20px 0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#57534E;transition:.13s;cursor:pointer}
.nav a svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav a .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
.nav a:hover{background:#FAF6F0}
.nav a.on{background:var(--or-soft);color:var(--or-d)}
.nav a.on svg{opacity:1}
.plist{display:flex;flex-direction:column;gap:1px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:#57534E;cursor:pointer;transition:.13s}
.pitem:hover{background:#FAF6F0}
.pitem.on{background:#FAF6F0;color:var(--ink);font-weight:700}
.pdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--grey)}
.sidesp{flex:1}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:1px dashed var(--line);border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px;cursor:pointer}
.newbtn:hover{border-color:var(--or);color:var(--or)}
.saved{font-size:10.5px;color:var(--green);text-align:center;opacity:0;transition:.3s;font-weight:600;height:14px}
.saved.on{opacity:1}
input[type=file]{display:none}

/* MAIN */
.main{overflow-y:auto}
.mhead{display:flex;align-items:flex-start;gap:16px;padding:26px 30px 16px;flex-wrap:wrap}
.mhead h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.mhead .sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.mhead .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:600;transition:.13s}
.btn svg{width:15px;height:15px}
.btn.o{border:1px solid var(--line);background:#fff;color:#44403C}.btn.o:hover{border-color:var(--muted-l)}
.btn.p{background:var(--or);color:#fff}.btn.p:hover{background:var(--or-d)}
.content{padding:0 30px 40px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:20px 22px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--kc)}
.kpi .l{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .n{font-size:44px;font-weight:800;letter-spacing:-1.5px;color:var(--kn,var(--ink));line-height:1.1;margin:8px 0 2px}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi .pill{margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px}
.pill.o{background:var(--or-soft);color:var(--or-d)}.pill.b{background:var(--blue-s);color:var(--blue)}
.pill.g{background:var(--green-s);color:var(--green)}.pill.r{background:var(--red-s);color:var(--red)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 16px}
.sechead h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.sechead a{font-size:13.5px;font-weight:600;color:var(--or);cursor:pointer}

/* toolbar */
.tools{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px 11px 36px;font-size:13.5px;background:#fff}
.search input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(232,89,12,.12)}
.search svg{position:absolute;left:12px;top:12px;width:15px;height:15px;color:var(--muted-l)}
.selct{border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13.5px;background:#fff;color:var(--ink)}
.selct:focus{outline:none;border-color:var(--or)}
.qf{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;color:#57534E;transition:.13s}
.qf svg{width:14px;height:14px}.qf .b{font-family:'IBM Plex Mono';font-weight:700}
.qf.over.on{background:var(--red-s);border-color:#F1C4BF;color:var(--red)}
.qf.crit.on{background:var(--or-soft);border-color:#F3CDB0;color:var(--or-d)}

/* location cards (dashboard) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pc{background:var(--card);border-radius:16px;box-shadow:var(--sh-s);padding:18px 20px;cursor:pointer;border:1px solid transparent;transition:.14s}
.pc:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:var(--line)}
.pc .h{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.pc .cdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.pc .nm{font-size:16px;font-weight:800;letter-spacing:-.2px}
.pc .pr{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--muted);border-radius:6px;padding:2px 7px}
.pc .pr.hot{background:var(--or)}
.pc .meta{font-size:12.5px;color:var(--muted);margin:2px 0 16px;padding-left:19px}
.pc .barrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pc .bar{flex:1;height:8px;background:var(--line2);border-radius:5px;overflow:hidden}
.pc .bar span{display:block;height:100%;border-radius:5px;background:var(--bc)}
.pc .pct{font-size:15px;font-weight:800;color:var(--ink)}
.pc .pills{display:flex;gap:8px;flex-wrap:wrap}
.tp{font-size:12px;font-weight:600;padding:4px 11px;border-radius:8px;background:var(--grey-s);color:#57534E}
.tp.g{background:var(--green-s);color:var(--green)}.tp.r{background:var(--red-s);color:var(--red)}.tp.b{background:var(--blue-s);color:var(--blue)}

/* board (All Locations chip grid) */
.legend{display:flex;gap:15px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.legend .i{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
.sw{width:12px;height:12px;border-radius:3px}
.sw.done{background:var(--green)}.sw.prog{background:var(--blue)}.sw.pend{background:var(--amber)}
.sw.nreq{background:repeating-linear-gradient(45deg,var(--grey),var(--grey) 3px,#d7d0c6 3px,#d7d0c6 6px)}
.sw.crit{background:var(--or);clip-path:polygon(50% 0,100% 100%,0 100%)}.sw.over{background:var(--red);border-radius:50%}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.scroller{overflow-x:auto}.grid{min-width:1160px}
.grow{display:grid;grid-template-columns:200px repeat(20,1fr);align-items:center}
.ghead{position:sticky;top:0;background:#FBF7F1;z-index:5;border-bottom:1px solid var(--line)}
.ghead .cell{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;padding:11px 2px;border-left:1px solid var(--line2)}
.ghead .cell:first-child{text-align:left;padding-left:16px;border-left:none;text-transform:none;font-size:10.5px}
.ghead .cell.hoto{color:var(--green)}
.grow.item{border-bottom:1px solid var(--line2);transition:.12s}.grow.item:hover{background:#FBF7F1}.grow.item:last-child{border-bottom:none}
.meta{padding:10px 14px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.meta .r1{display:flex;align-items:center;gap:7px}.meta .wtg{font-weight:700;font-size:13px}
.pri{font-size:9.5px;font-weight:700;color:#fff;background:var(--muted);border-radius:5px;padding:1px 6px}.pri.hot{background:var(--or)}
.ra{font-size:10px;font-weight:700;color:var(--red);background:var(--red-s);border-radius:20px;padding:1px 7px;display:inline-flex;gap:3px;align-items:center}.ra svg{width:9px;height:9px}
.meta .dev{font-size:11px;color:var(--muted)}
.pbar{height:5px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:2px;position:relative;width:150px;max-width:100%}
.pbar span{position:absolute;left:0;top:0;height:100%;background:var(--bc,var(--green));border-radius:4px}
.pct{font-size:10.5px;color:var(--muted);font-weight:600}
.chip{height:21px;margin:0 2px;border-radius:4px;position:relative;cursor:pointer;transition:.1s}
.chip:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(60,40,20,.16)}
.chip.done{background:var(--green)}.chip.prog{background:var(--blue)}.chip.pend{background:var(--amber);opacity:.85}
.chip.nreq{background:repeating-linear-gradient(45deg,var(--grey),var(--grey) 3px,#d7d0c6 3px,#d7d0c6 6px)}
.chip.crit{box-shadow:inset 0 0 0 1.5px var(--or-d)}
.chip .cf{position:absolute;top:0;left:0;border-top:8px solid var(--or-d);border-right:8px solid transparent;border-top-left-radius:4px}
.chip .al{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid #fff;animation:blip 1.4s infinite}
@keyframes blip{0%,100%{box-shadow:0 0 0 0 rgba(224,69,58,.5)}50%{box-shadow:0 0 0 4px rgba(224,69,58,0)}}
@media(prefers-reduced-motion:reduce){.chip .al{animation:none}}

/* pipeline */
.prow{display:grid;grid-template-columns:150px 1fr 140px;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:none}.prow .nm{font-size:12.5px;font-weight:600}.prow .nm.hoto{color:var(--green)}
.trk{height:14px;background:var(--line2);border-radius:7px;overflow:hidden;display:flex}
.trk i.done{background:var(--green);height:100%}.trk i.prog{background:var(--blue);height:100%}
.prow .st{font-size:11px;color:var(--muted);text-align:right}.prow .st b{color:var(--green);font-weight:700}

/* alerts */
.atable{width:100%;border-collapse:collapse;background:#fff}
.atable th{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:13px 15px;background:#FBF7F1;border-bottom:1px solid var(--line)}
.atable td{padding:12px 15px;border-bottom:1px solid var(--line2);font-size:12.5px}
.atable tr:hover td{background:#FBF7F1}
.atable .wl{font-weight:700;cursor:pointer}.atable .wl:hover{color:var(--or)}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-flex;gap:4px;align-items:center}
.badge.done{background:var(--green-s);color:var(--green)}.badge.prog{background:var(--blue-s);color:var(--blue)}
.badge.pend{background:var(--amber-s);color:#9A6A16}.badge.nreq{background:var(--grey-s);color:#6B6459}
.badge.crit{background:var(--or-soft);color:var(--or-d)}.badge.over{background:var(--red-s);color:var(--red)}
.dlt{font-family:'IBM Plex Mono';font-weight:600}.dlt.neg{color:var(--red)}.dlt.pos{color:var(--muted)}
.clx{color:var(--muted);font-size:11.5px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clx .ts{color:var(--muted-l);font-family:'IBM Plex Mono';font-size:10.5px}

.empty{padding:60px 24px;text-align:center;color:var(--muted)}.empty .big{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px}

/* drawer */
#tt{position:fixed;z-index:90;background:#2A2420;color:#fff;font-size:11.5px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:.1s;max-width:230px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
#tt b{font-weight:600}#tt .s{color:#C9BFB4}#tt .r{display:flex;justify-content:space-between;gap:12px;margin-top:3px}#tt .ov{color:#F3A79D;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:94vw;background:#FBF7F1;z-index:70;transform:translateX(103%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(40,30,20,.2)}
.drawer.on{transform:translateX(0)}
.dhead{background:linear-gradient(135deg,var(--or),#F0791F);color:#fff;padding:22px 24px;position:relative}
.dclose{position:absolute;right:14px;top:14px;color:rgba(255,255,255,.8);font-size:22px;width:32px;height:32px;border-radius:9px;line-height:1}.dclose:hover{background:rgba(255,255,255,.18);color:#fff}
.dhead h2{font-size:24px;font-weight:800}.dhead .dev{color:rgba(255,255,255,.85);font-size:12.5px;margin-top:3px}
.dmeta{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.dmeta div{font-size:10.5px;color:rgba(255,255,255,.75)}.dmeta b{display:block;color:#fff;font-size:14px;font-weight:700;margin-top:2px;font-family:'IBM Plex Mono'}
.dbody{flex:1;overflow-y:auto;padding:16px 18px 26px}
details.stn{background:#fff;border-radius:12px;box-shadow:var(--sh-s);margin-bottom:8px;overflow:hidden;border-left:3px solid var(--c,var(--grey))}
details.stn.over{border-left-color:var(--red)}
details.stn>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px}
details.stn>summary::-webkit-details-marker{display:none}
summary .idx{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted-l);width:16px}
summary .snm{flex:1;font-size:13.5px;font-weight:600}details.stn.hoto summary .snm{color:var(--green)}
summary .sdue{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono'}
summary .sob{font-size:9.5px;font-weight:700;color:var(--red);background:var(--red-s);border-radius:20px;padding:2px 7px;display:inline-flex;gap:3px;align-items:center;white-space:nowrap}summary .sob svg{width:9px;height:9px}
summary .star{font-size:16px;line-height:1;color:#D6CEC4;padding:2px}summary .star.on{color:var(--or)}summary .star:hover{transform:scale(1.12)}
summary .stpill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;background:var(--cs);color:var(--c)}
.sbody{padding:2px 14px 14px 40px}
.mrow{display:flex;align-items:center;gap:9px;margin:9px 0}
.mrow label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;width:66px}
.mrow input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px}.mrow input[type=date]:focus{outline:none;border-color:var(--or)}
.mrow .clr{font-size:10.5px;color:var(--muted-l);text-decoration:underline;cursor:pointer}
.clog{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;margin:6px 0}
.cnote{background:#FBF7F1;border-radius:9px;padding:8px 10px;font-size:12.5px;position:relative}
.cnote .ts{display:block;font-size:9.5px;color:var(--muted-l);font-family:'IBM Plex Mono';margin-bottom:2px}
.cnote .del{position:absolute;right:6px;top:6px;color:#CFC7BC;font-size:13px;padding:2px}.cnote .del:hover{color:var(--red)}
.cempty{font-size:11px;color:var(--muted-l);font-style:italic;padding:2px}
.cadd{display:flex;gap:6px;margin-top:6px}
.cadd input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}.cadd input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(232,89,12,.1)}
.cadd button{background:var(--or);color:#fff;font-size:12px;font-weight:600;padding:0 14px;border-radius:8px}.cadd button:hover{background:var(--or-d)}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){body{overflow:auto}.app{display:block;height:auto}.side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:0;z-index:30}.slab,.sidesp,.plist{display:none}.nav{flex-direction:row;flex-wrap:wrap}.kpis{grid-template-columns:1fr}}

body.embed .side{display:none}
body.embed .app{grid-template-columns:1fr}
body.embed .mhead{padding-top:22px}
.embedbar{display:flex;align-items:center;gap:10px;padding:0 30px 10px;flex-wrap:wrap}
body.embed #nav{flex-direction:row;gap:4px}
body.embed #nav a{padding:8px 13px}
body.embed .embed-plist{display:flex;gap:6px;margin-left:auto;flex-direction:row}
body.embed .embed-plist .pitem{padding:6px 11px;border:1px solid var(--line);border-radius:9px}
body.embed .newbtn{margin:0;padding:9px 13px}
body.ro .cadd,body.ro .mrow,body.ro summary .star,body.ro .cnote .del,body.ro .newbtn{display:none!important}
body.ro summary .stpill{pointer-events:none}

.empty .emk{font-size:40px;margin-bottom:6px}
.empty .emcta{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.lmodal-scrim{position:fixed;inset:0;background:rgba(40,30,20,.42);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.lmodal-scrim.on{opacity:1;pointer-events:auto}
.lmodal{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.18s;width:430px;max-width:92vw;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(40,30,20,.28);overflow:hidden}
.lmodal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.lm-head{padding:16px 20px;font-size:16px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.lm-head .x{font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
.lm-body{padding:14px 20px 4px;display:flex;flex-direction:column}
.lm-body label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 5px}
.lm-body input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px}
.lm-body input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(232,89,12,.12)}
.lm-row{display:flex;gap:12px}.lm-row>div{flex:1;display:flex;flex-direction:column}

<body>
<div class="app" id="app">

      <div><div class="nm">HOTO Tracker</div><div class="tg">Wind Handover</div></div></div>
    <div class="slab">Menu</div>

      <a data-v="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>All Locations</a>
      <a data-v="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>Alerts<span class="cnt" id="navAlert">0</span></a>
      <a data-v="pipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Pipeline</a>
    </div>
    <div class="slab">Projects</div>
    <div class="plist" id="plist"></div>
    <div class="sidesp"></div>
    <div class="saved" id="saved">Saved ✓</div>
    <label class="newbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add project (CSV/JSON)<input type="file" id="imp" accept=".csv,.json"/></label>
  </aside>

  <main class="main">
    <div class="mhead">

      <div class="acts">
        <button class="btn o" id="expCsv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l4-4m-4 4l-4-4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Export CSV</button>
        <button class="btn o" id="expJson">Backup JSON</button>
      </div>
    </div>
    <div class="content">
      <!-- toolbar (dashboard + board) -->
      <div class="tools" id="tools">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="Search WTG ID…"/></div>
        <select class="selct" id="devsel"></select>
        <button class="qf over" id="fOver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>Overdue <span class="b" id="fOverN">0</span></button>
        <button class="qf crit" id="fCrit">★ Critical <span class="b" id="fCritN">0</span></button>

      </div>

        </div>
        <div class="panel"><div class="scroller"><div class="grid" id="grid"></div></div></div>
      </div>
      <div id="view-pipe" style="display:none"><div class="panel" id="pipe" style="padding:8px 4px"></div></div>
      <div id="view-alerts" style="display:none"><div class="panel"><div class="scroller" id="alerts"></div></div></div>
    </div>

  </aside>
</div>

function today(){return new Date();}
function todayStr(){const d=today();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysB(a,b){return Math.round((new Date(a)-new Date(b))/864e5);}
function isOver(c){return c.due&&c.status!=='Done'&&c.status!=='Not Required'&&c.due<todayStr();}
function pctOf(r){const q=r.cells.filter(c=>c.status!=='Not Required').length,d=r.cells.filter(c=>c.status==='Done').length;return q?d/q:0;}
function rOver(r){return r.cells.filter(isOver).length;}
function rCrit(r){return r.cells.filter(c=>c.critical).length;}
function rDone(r){return r.cells.filter(c=>c.status==='Done').length;}
function rProg(r){return r.cells.filter(c=>c.status==='In Progress').length;}

$('#expJson').onclick=()=>dl('HOTO_backup_'+todayStr()+'.json',JSON.stringify({projects,rows}),'application/json');
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>f.name.toLowerCase().endsWith('.json')?loadJSON(rd.result):loadCSV(rd.result);rd.readAsText(f);e.target.value='';};

/* ===== Supabase (anon, open policies) ===== */
function toData(r){return {dev:r.dev,pri:r.pri,owner_land:r.owner_land,targetHOTO:r.targetHOTO,actualHOTO:r.actualHOTO,blocker:r.blocker,support:r.support,remark:r.remark,cells:r.cells};}
function fromRow(d,project,wtg,i){const x=d||{};return {project,wtg,dev:x.dev||'—',pri:(x.pri===undefined?null:x.pri),owner_land:x.owner_land||'',rating:x.rating||'',targetHOTO:x.targetHOTO||'',actualHOTO:x.actualHOTO||'',blocker:x.blocker||'',support:x.support||'',remark:x.remark||'',_i:i,cells:(x.cells||[]).map(c=>({status:c.status,due:c.due||'',critical:!!c.critical,comments:c.comments||[]}))};}
async function saveLoc(r){if(!sb||!r)return;try{const {error}=await sb.from('hoto_locations').upsert({project:r.project,wtg:r.wtg,data:toData(r),updated_at:new Date().toISOString()},{onConflict:'project,wtg'});if(error)console.error('save',error);}catch(e){console.error('save',e);}}
async function pushAll(){if(!sb)return;try{const payload=rows.map(r=>({project:r.project,wtg:r.wtg,data:toData(r),updated_at:new Date().toISOString()}));const {error}=await sb.from('hoto_locations').upsert(payload,{onConflict:'project,wtg'});if(error)console.error('pushAll',error);}catch(e){console.error('pushAll',e);}}
async function cloudLoad(){try{let q=sb.from('hoto_locations').select('project,wtg,data');if(PROJ)q=q.eq('project',PROJ);const {data,error}=await q;if(error){console.error('load',error);return null;}return data;}catch(e){console.error('load',e);return null;}}
function applyCloud(d){rows=d.map((row,i)=>fromRow(row.data,row.project,row.wtg,i));projects=[...new Set(rows.map(r=>r.project))];if(PROJ){forceProj();}else if(!state.project||!projects.includes(state.project))state.project=projects[0];}
let _rt;function refreshFromCloud(){clearTimeout(_rt);_rt=setTimeout(async()=>{const d=await cloudLoad();if(!d)return;const openWtg=state.open!=null?(rows.find(r=>r._i===state.open)||{}).wtg:null;applyCloud(d);if(openWtg){const nr=rows.find(r=>r.wtg===openWtg&&r.project===state.project);state.open=nr?nr._i:null;}renderSidebar();renderHeadbar();setView(state.view);if(state.open!=null)renderDrawer();},250);}
function subscribe(){try{let ch=sb.channel('hoto').on('postgres_changes',{event:'*',schema:'public',table:'hoto_locations'},refreshFromCloud);ch.subscribe();}catch(e){console.error('realtime',e);}}
async function bootCloud(){try{const d=await cloudLoad();if(d&&d.length){applyCloud(d);}else{rows=(PROJ?[]:freshRows());projects=[...new Set(rows.map(r=>r.project))];forceProj();if(!PROJ){rows=freshRows();projects=[...new Set(rows.map(r=>r.project))];state.project=projects[0];await pushAll();}}}catch(e){console.error('bootCloud',e);}if(!rows){rows=[];}if(!projects.length&&!PROJ){rows=freshRows();projects=[...new Set(rows.map(r=>r.project))];state.project=projects[0];}forceProj();boot();subscribe();}
function forceProj(){if(PROJ){if(!projects.includes(PROJ))projects=[PROJ,...projects];state.project=PROJ;}}
function boot(){if(EMBED)applyEmbed();renderSidebar();renderHeadbar();setView(state.view);addHeaderBtn();}
if(sb){bootCloud();}else{init();forceProj&&forceProj();boot();}
</script></body></html>
